<html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:400;src:url("fonts/Inter_400Regular.ttf")}
@font-face{font-family:Inter;font-weight:800;src:url("fonts/Inter_800ExtraBold.ttf")}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:Inter,-apple-system,sans-serif;color:#fff;position:relative;
  background:radial-gradient(90% 120% at 15% 20%,#0B4F4F 0%,#0A2E2E 50%,#0A1414 100%)}
.text{position:absolute;left:72px;top:0;bottom:0;width:540px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.brand img{width:88px;height:88px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.brand span{font-weight:800;font-size:40px;letter-spacing:-0.01em}
h1{margin:0;font-weight:800;font-size:56px;line-height:1.06;letter-spacing:-0.02em;text-wrap:balance}
h1 .a{color:#F5A623}
p{margin:18px 0 0;font-size:24px;line-height:1.35;color:#cfdedc;text-wrap:balance}
.phone{position:absolute;right:70px;top:46px;width:290px;border-radius:44px;padding:9px;background:#050a0a;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08);transform:rotate(-4deg)}
.phone img{display:block;width:100%;border-radius:35px}

<div class="text">
  <div class="brand"><img src="../../ios/Peguei/Images.xcassets/AppIcon.appiconset/icon-1024.png" alt=""><span>Peguei</span></div>
